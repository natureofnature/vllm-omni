# MiniCPM-o 4.5 native duplex deployment.
#
# The registered minicpmo_4_5 pipeline owns the fixed
# Thinker -> Talker -> Code2Wav topology. This overlay changes session
# lifetime and bounds all three stages to eight live duplex sessions.
# The eight-session settings require an accelerator with at least 80 GB HBM.
# They were validated on H800 80GB; H100 has not been validated.
base_config: minicpmo_4_5.yaml
pipeline: minicpmo_4_5
session_mode: duplex
active_stream_window: 8
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 3
      # Align all eight initial and steady-state request waves for one
      # physical diffusion batch whenever upstream chunks arrive together.
      code2wav_initial_batch_size: 8
      code2wav_batch_target_size: 8
      code2wav_batch_wait_ms: 50
      code2wav_batch_quiet_ms: 12
duplex_session:
  idle_ttl_s: 300
  disconnect_grace_s: 30
  reaper_interval_s: 5
  resume_replay_ttl_s: 60
  resume_replay_max_bytes_per_session: 8388608
  max_pending_input_bytes_per_session: 16777216
  max_pending_turns_per_session: 4
  # Matches the configured Stage0/Stage1 sequence capacity below.
  max_sessions: 8
  completed_append_cache_size: 256

stages:
  - stage_id: 0
    max_num_seqs: 8
    async_scheduling: false

  - stage_id: 1
    max_num_seqs: 8
    # Eight Talker sequences fit below this automatically profiled KV share;
    # reserve the remaining HBM for a concurrent Code2Wav diffusion batch.
    gpu_memory_utilization: 0.10
    async_scheduling: false
    # Talker context is 4096 (tts_config.max_position_embeddings).
    max_model_len: 4096
    # Overlay only the knobs duplex changes. Codec temperature / top_k stay
    # on the base YAML. Native duplex still ends each Talker request after
    # one generate_chunk (26 samples, last is codec EOS) inside the model;
    # YAML max_tokens is only the hard ceiling.
    default_sampling_params:
      max_tokens: 4096
      min_tokens: 0

  - stage_id: 2
    max_num_seqs: 8
    async_scheduling: false
